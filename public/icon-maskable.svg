<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable safe zone -->
  <rect width="512" height="512" fill="url(#bgMask)" />

  <!-- Content scaled within safe-zone (central 80%) -->
  <g transform="translate(51.2, 51.2) scale(0.8)">
    <!-- ID Card Graphic -->
    <rect x="96" y="110" width="320" height="200" rx="24" fill="rgba(15, 23, 42, 0.75)" stroke="url(#accMask)" stroke-width="6" />
    
    <!-- Card Header Stripe -->
    <path d="M 96 142 L 416 142" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />

    <!-- Avatar Circle -->
    <circle cx="160" cy="225" r="38" fill="#38bdf8" />
    <path d="M 136 250 A 24 24 0 0 1 184 250" stroke="#0f172a" stroke-width="6" fill="none" stroke-linecap="round" />
    <circle cx="160" cy="215" r="14" fill="#0f172a" />

    <!-- Card Lines -->
    <rect x="220" y="195" width="160" height="12" rx="6" fill="#ffffff" />
    <rect x="220" y="222" width="110" height="10" rx="5" fill="#94a3b8" />
    <rect x="220" y="246" width="80" height="10" rx="5" fill="#38bdf8" />

    <!-- Small QR Code Badge on card -->
    <rect x="345" y="220" width="45" height="45" rx="8" fill="#ffffff" />
    <rect x="352" y="227" width="12" height="12" fill="#0f172a" />
    <rect x="371" y="227" width="12" height="12" fill="#0f172a" />
    <rect x="352" y="246" width="12" height="12" fill="#0f172a" />
    <rect x="371" y="246" width="12" height="12" fill="#0284c7" />

    <!-- Typography Brand "DM DIGITALMEERA" -->
    <text x="256" y="380" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
      DIGITALMEERA
    </text>
    <text x="256" y="420" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="3">
      KURSUS &amp; ABSENSI
    </text>
  </g>
</svg>
